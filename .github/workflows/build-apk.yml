name: Build APK

# Builds the Android APK and attaches it to a GitHub (pre)release. Trigger by
# pushing a tag like `apk-dev-1`, or manually via workflow_dispatch (which
# mints an `apk-dev-<run number>` tag itself).
on:
  push:
    tags: ['apk-*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL, including /v1 (e.g. https://xyz.trycloudflare.com/v1). Defaults to the ETMS_API_BASE_URL repo variable.'
        required: false
      tenant_slug:
        description: 'Tenant the build signs into (the seeded demo tenant is "acme").'
        required: false
        default: acme

permissions:
  contents: write

jobs:
  apk:
    name: Android APK (development flavor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etms_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .github/workflows/ci.yml.
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Both defines matter: without TENANT_SLUG the login posts an empty tenant
      # and the backend rejects it, however healthy the API is.
      - run: >
          flutter build apk --release
          -t lib/main_development.dart
          --dart-define=API_BASE_URL=${{ inputs.api_base_url || vars.ETMS_API_BASE_URL || 'https://api.dev.etms.app/v1' }}
          --dart-define=TENANT_SLUG=${{ inputs.tenant_slug || vars.ETMS_TENANT_SLUG || 'acme' }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/etms-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: etms-dev-apk
          path: etms_app/build/app/outputs/flutter-apk/etms-dev.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-dev-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: etms_app/build/app/outputs/flutter-apk/etms-dev.apk
