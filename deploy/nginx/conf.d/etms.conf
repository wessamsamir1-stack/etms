# ---------------------------------------------------------------------------
# ETMS API vhost. HTTP serves only the ACME challenge and the redirect; every
# real request is HTTPS.
#
# To run without TLS (behind a cloud load balancer that already terminates it),
# delete the 443 server block and move the location blocks into the 80 one.
# ---------------------------------------------------------------------------
server {
  # IPv6 is off by default in Docker; add `listen [::]:80;` once the daemon has
  # it enabled, or nginx will refuse to start.
  listen 80;
  server_name _;

  # Container-level liveness (the compose healthcheck hits this).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # certbot --webroot -w ./nginx/certbot -d api.example.com
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  # Replace with your API hostname, e.g. api.etms.example.com. Left as the
  # default server so the stack answers before DNS is pointed at it.
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  # HSTS is also set by the API itself in production; harmless to repeat.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # ---- Server-Sent Events: live vehicle tracking --------------------------
  # proxy_buffering off is the whole point — with it on, nginx accumulates the
  # response and the client sees nothing until the buffer fills, which for an
  # endless stream is never. proxy_cache off stops any caching layer from
  # trying to store the stream; chunked_transfer_encoding off + HTTP/1.1 keep
  # the frames going out exactly as the API wrote them; and the read timeout
  # must outlast the API's 25s heartbeat comment by a wide margin.
  location = /v1/tracking/stream {
    proxy_pass http://etms_api;
    proxy_http_version 1.1;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding off;
    gzip off;

    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    send_timeout       24h;

    proxy_set_header Connection '';           # keep-alive to the upstream
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Belt and braces: the API already sends this, and it also disables
    # buffering in any other proxy in the chain that honours it.
    proxy_set_header X-Accel-Buffering no;
  }

  # ---- Everything else: normal JSON API -----------------------------------
  location / {
    proxy_pass http://etms_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}
