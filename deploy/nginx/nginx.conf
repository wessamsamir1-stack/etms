# ETMS edge proxy. The one thing that must not be got wrong here is SSE:
# /v1/tracking/stream is an infinite response, so any response buffering or a
# normal read timeout turns live tracking into "nothing ever arrives".
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;   # SSE holds one connection per watching client
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  75s;
  server_tokens   off;

  # The API answers JSON; GPS ping batches are the biggest bodies it takes
  # (backend bodyLimit is 1 MB — keep the two in step).
  client_max_body_size 1m;

  gzip on;
  gzip_types application/json application/problem+json text/plain;
  # Never gzip the event stream: compression buffers, and buffering kills SSE.
  gzip_proxied off;

  # Trust the immediate proxy only; adjust to your load balancer's subnet.
  real_ip_header X-Forwarded-For;

  upstream etms_api {
    # Compose DNS round-robins across the api replicas.
    server api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
