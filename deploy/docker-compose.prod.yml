# =============================================================================
# ETMS — production stack.
#
#   db        Postgres 16 + PostGIS (the only stateful service)
#   pgbouncer connection pooler, TRANSACTION pooling — what the API connects to
#   migrate   one-shot: schema + DB roles, must finish before api/worker start
#   api       the REST + SSE service (2 replicas by default)
#   worker    notification outbox drainer
#   nginx     TLS terminator / reverse proxy, SSE-aware (no buffering)
#
# Build context is the REPO ROOT so db/migrations lands in the image:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# NOTE ON POOLING: transaction pooling multiplexes one server connection per
# TRANSACTION, which is why the API's LISTEN/NOTIFY connection must NOT use it —
# a session-lifetime LISTEN would be handed to another client mid-stream and the
# live-tracking feed would silently go dark. The api service therefore gets
# LISTENER_DATABASE_URL pointing straight at Postgres, port 5432, while every
# normal query goes through pgbouncer on 6432.
# =============================================================================
name: etms

x-image: &image
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: etms-backend:${ETMS_TAG:-latest}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-etms}
    # Not published on the host: only the compose network reaches Postgres.
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Transaction pooling: hundreds of idle API connections collapse onto a small
  # number of real Postgres backends. Safe for this codebase — every tenant-scoped
  # request runs inside one transaction (Db.withTenant BEGINs, sets the RLS
  # context with set_config(...,true) = transaction-local, and COMMITs), so no
  # session state ever leaks between clients.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-etms}
      DB_USER: ${APP_DB_USER:-etms_app_login}
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-25}
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 120
      # Transaction pooling cannot keep server-side prepared statements around.
      MAX_PREPARED_STATEMENTS: 0
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    expose:
      - "6432"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Schema + roles. Connects DIRECTLY to Postgres as the admin user: migrations
  # run DDL, create roles and SECURITY DEFINER functions, none of which belongs
  # on a transaction-pooled connection.
  migrate:
    <<: *image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-etms}
      APP_DB_USER: ${APP_DB_USER:-etms_app_login}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-etms_platform_login}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?set PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD}
    command: >
      sh -c "node dist/scripts/migrate.js
          && node dist/scripts/create-app-role.js
          && node dist/scripts/create-platform-role.js
          && node dist/scripts/seed-platform.js"

  api:
    <<: *image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8080
      # Normal traffic → pooler (transaction pooling).
      DATABASE_URL: postgres://${APP_DB_USER:-etms_app_login}:${APP_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-etms}
      # Realtime LISTEN/NOTIFY → straight to Postgres, never the pooler.
      LISTENER_DATABASE_URL: postgres://${APP_DB_USER:-etms_app_login}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-etms}
      # Cross-tenant Super-Admin API (BYPASSRLS role), also via the pooler.
      PLATFORM_DATABASE_URL: postgres://${PLATFORM_DB_USER:-etms_platform_login}:${PLATFORM_DB_PASSWORD}@db:5432/${POSTGRES_DB:-etms}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      QR_SECRET: ${QR_SECRET:?set QR_SECRET (32+ chars)}
      # Exact dashboard origin — '*' is rejected at boot in production.
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
    expose:
      - "8080"
    deploy:
      replicas: ${API_REPLICAS:-2}

  # Drains the `notification` outbox across tenants (BYPASSRLS role). Direct
  # connection: it is a long-running poller, not request traffic.
  worker:
    <<: *image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: postgres://${PLATFORM_DB_USER:-etms_platform_login}:${PLATFORM_DB_PASSWORD}@db:5432/${POSTGRES_DB:-etms}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-2000}
    command: sh -c "node dist/scripts/notification-worker.js"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  db_data:
  certbot_webroot:
