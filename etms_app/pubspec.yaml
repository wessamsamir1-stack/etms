name: etms_app
description: "ETMS — Enterprise Employee Transportation Management System (Flutter client)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# NOTE: This skeleton deliberately avoids build_runner codegen so it compiles
# as-is after `flutter pub get`. DTOs hand-write (de)serialization, Riverpod uses
# the non-generated API, and the offline store uses raw SQL via sqflite.
dependencies:
  cloud_firestore: ^5.2.1
  connectivity_plus: ^6.0.5
  dio: ^5.5.0 # networking (REST API — see core/network)
  equatable: ^2.0.5
  firebase_auth: ^5.1.4
  firebase_core: ^3.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1 # state management (non-generated API)
  flutter_secure_storage: ^9.2.2
  fpdart: ^1.1.0 # functional error handling (Either<Failure, T>)
  go_router: ^14.2.0 # routing
  intl: ^0.20.2 # pinned by flutter_localizations; no direct use in lib/
  logger: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3 # offline persistence (raw SQL)
  supabase_flutter: ^2.5.6 # BaaS (abstracted behind core/backend/BackendClient)

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from l10n.yaml
  assets:
    - assets/branding/
