name: etms_app
description: "ETMS — Enterprise Employee Transportation Management System (Flutter client)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# NOTE: This skeleton deliberately avoids build_runner codegen so it compiles
# as-is after `flutter pub get`. DTOs hand-write (de)serialization, Riverpod uses
# the non-generated API, and the offline store uses raw SQL via sqflite.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking (REST API — see core/network)
  dio: ^5.5.0

  # Functional error handling (Either<Failure, T>)
  fpdart: ^1.1.0

  # Backend-as-a-Service (abstracted behind core/backend/BackendClient)
  supabase_flutter: ^2.5.6
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Offline persistence + connectivity
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Utilities
  equatable: ^2.0.5
  intl: ^0.20.2
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from l10n.yaml
  assets:
    - assets/branding/
